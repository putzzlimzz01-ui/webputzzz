<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Galeri Foto Saya</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#111; font-family:Arial,sans-serif; color:#fff; }

h1 {
  text-align:center;
  padding: 30px 20px 10px;
  font-size: 28px;
}
h1 span { color:#a855f7; }

p.sub {
  text-align:center;
  color:#888;
  padding-bottom:30px;
  font-size:14px;
}

/* GRID FOTO */
.galeri {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  padding: 16px;
  max-width: 1000px;
  margin: 0 auto;
}

/* TIAP FOTO */
.foto {
  border-radius: 12px;
  overflow: hidden;
  background: #222;
  cursor: pointer;
  transition: transform 0.2s;
}
.foto:hover { transform: scale(1.03); }

.foto img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  display: block;
}

.foto p {
  text-align:center;
  padding: 8px;
  font-size: 13px;
  color: #ccc;
}

/* LIGHTBOX */
.lb {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.92);
  z-index:999;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  padding:20px;
}
.lb.buka { display:flex; }

.lb img {
  max-width:100%;
  max-height:75vh;
  border-radius:12px;
  object-fit:contain;
}

.lb p {
  margin-top:12px;
  font-size:16px;
  color:#ddd;
}

.lb-tutup {
  position:absolute;
  top:16px; right:20px;
  font-size:32px;
  cursor:pointer;
  color:#fff;
  background:none;
  border:none;
}

.lb-nav {
  display:flex;
  gap:20px;
  margin-top:16px;
}
.lb-nav button {
  background:#a855f7;
  border:none;
  color:#fff;
  padding:10px 24px;
  border-radius:50px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

footer {
  text-align:center;
  padding:30px;
  color:#555;
  font-size:13px;
}
</style>
</head>
<body>

<h1>📸 Galeri <span>Foto Saya</span></h1>
<p class="sub">Klik foto untuk lihat lebih besar</p>

<!-- ============================================
     GALERI FOTO
     
     CARA TAMBAH FOTO:
     Copy blok <div class="foto"> di bawah
     Ganti SRC dengan link foto kamu
     Ganti teks judul foto
============================================ -->

<div class="galeri" id="galeri">

  <!-- FOTO 1 -->
  <div class="foto">
    <img src="https://drive.google.com/uc?export=view&id=1XZ5cVDAjnol8Tlje_KUjQoLdQMX1I6xA" alt="foto"/>
    <p>Judul Foto 1</p>
  </div>

  <!-- FOTO 2 -->
  <div class="foto">
    <img src="GANTI_LINK_FOTO_2" alt="foto"/>
    <p>Judul Foto 2</p>
  </div>

  <!-- FOTO 3 -->
  <div class="foto">
    <img src="GANTI_LINK_FOTO_3" alt="foto"/>
    <p>Judul Foto 3</p>
  </div>

  <!-- TAMBAH FOTO BARU DI SINI -->
  <!-- Copy blok ini dan paste di bawah -->
  <!--
  <div class="foto">
    <img src="LINK_FOTO_KAMU" alt="foto"/>
    <p>Judul Foto</p>
  </div>
  -->

</div>

<footer>© Galeri Foto Saya • Dibuat dengan GitHub Pages</footer>

<!-- LIGHTBOX -->
<div class="lb" id="lb">
  <button class="lb-tutup" id="tutup">✕</button>
  <img id="lb-img" src="" alt=""/>
  <p id="lb-judul"></p>
  <div class="lb-nav">
    <button id="prev">← Sebelumnya</button>
    <button id="next">Berikutnya →</button>
  </div>
</div>

<script>
const fotos = document.querySelectorAll('.foto');
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lb-img');
const lbJudul = document.getElementById('lb-judul');
let idx = 0;

function buka(i) {
  idx = i;
  lbImg.src = fotos[i].querySelector('img').src;
  lbJudul.textContent = fotos[i].querySelector('p').textContent;
  lb.classList.add('buka');
}

fotos.forEach((f, i) => f.addEventListener('click', () => buka(i)));

document.getElementById('tutup').onclick = () => lb.classList.remove('buka');
document.getElementById('prev').onclick = () => buka((idx - 1 + fotos.length) % fotos.length);
document.getElementById('next').onclick = () => buka((idx + 1) % fotos.length);

lb.addEventListener('click', e => { if(e.target === lb) lb.classList.remove('buka'); });

// Swipe di HP
let tx = 0;
lb.addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
lb.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx;
  if(Math.abs(dx) > 50) dx < 0 ? buka((idx+1)%fotos.length) : buka((idx-1+fotos.length)%fotos.length);
});
</script>

</body>
</html>
